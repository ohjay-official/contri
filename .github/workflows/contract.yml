name: contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - contract/**
      - .github/workflows/contract.yml
      - scripts/abi.py

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install || true
          rustup show

      - name: Unit tests
        id: test
        continue-on-error: true
        run: |
          mkdir -p ../ci-out
          set -o pipefail
          cargo test 2>&1 | tee ../ci-out/test.log

      - name: Install cargo-near
        id: install
        continue-on-error: true
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh

      - name: Generate the ABI from the typed interface
        id: abi
        continue-on-error: true
        run: |
          set -o pipefail
          (cd interface && cargo near abi) 2>&1 | tee ../ci-out/abi.log
          python3 ../scripts/abi.py sync interface/target/near/*_abi.json abi/contri_abi.json ../ci-out/abi_drift
          python3 -c "import json,sys; print(json.dumps(json.load(open('abi/contri_abi.json')),separators=(',',':')),end='')" > ../ci-out/contri_abi.min.json
          (command -v zstd >/dev/null || sudo apt-get install -y -qq zstd >/dev/null)
          zstd -q -f --ultra -22 ../ci-out/contri_abi.min.json -o abi/contri_abi.zst
          cp abi/contri_abi.json abi/contri_abi.zst ../ci-out/
          ls -l abi | tee -a ../ci-out/abi.log

      - name: Build wasm
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          (cargo near build non-reproducible-wasm --no-abi || cargo near build non-reproducible-wasm --no-embed-abi) 2>&1 | tee ../ci-out/build.log
          cp target/near/contri.wasm ../ci-out/contri.wasm
          ls -l ../ci-out/contri.wasm | tee -a ../ci-out/build.log

      - name: Check the ABI lists exactly the exported methods
        id: exports
        if: steps.build.outcome == 'success' && steps.abi.outcome == 'success'
        continue-on-error: true
        run: python3 ../scripts/abi.py exports ../ci-out/contri.wasm abi/contri_abi.json 2>&1 | tee ../ci-out/exports.log

      - name: Measure size and storage cost
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq binaryen >/dev/null 2>&1 || true
          RAW=$(stat -c %s ../ci-out/contri.wasm)
          OPT=$RAW
          if command -v wasm-opt >/dev/null; then
            wasm-opt -Oz --strip-debug --strip-producers --enable-bulk-memory --enable-sign-ext --enable-mutable-globals ../ci-out/contri.wasm -o ../ci-out/contri.opt.wasm && OPT=$(stat -c %s ../ci-out/contri.opt.wasm)
          fi
          # NEAR storage staking: 1 NEAR per 100,000 bytes (refundable when storage is freed)
          echo "{\"raw_bytes\":$RAW,\"opt_bytes\":$OPT,\"raw_near\":$(echo "scale=3; $RAW/100000" | bc),\"opt_near\":$(echo "scale=3; $OPT/100000" | bc)}" | tee ../ci-out/size.json

      - name: Size profile (what takes the space). Add [profile] to a commit message to run it.
        if: steps.build.outcome == 'success' && contains(github.event.head_commit.message, '[profile]')
        continue-on-error: true
        run: |
          cargo install twiggy --locked -q 2>/dev/null || cargo install twiggy -q
          # Same --cfg near as cargo-near, so host functions are used like in the real build.
          RUSTFLAGS="--cfg near" CARGO_PROFILE_RELEASE_STRIP=false cargo build --release --target wasm32-unknown-unknown -q 2>&1 | tail -5
          W=target/wasm32-unknown-unknown/release/contri.wasm
          ls -l $W | tee ../ci-out/profile.txt
          twiggy top -n 60 $W >> ../ci-out/profile.txt 2>&1
          echo "=== garbage ===" >> ../ci-out/profile.txt
          twiggy garbage -n 10 $W >> ../ci-out/profile.txt 2>&1
          echo "=== monos ===" >> ../ci-out/profile.txt
          twiggy monos -n 30 $W >> ../ci-out/profile.txt 2>&1

      - name: Write status
        if: always()
        run: |
          mkdir -p ../ci-out
          cat > ../ci-out/status.json <<EOF
          {"commit":"${GITHUB_SHA}","test":"${{ steps.test.outcome }}","install":"${{ steps.install.outcome }}","abi":"${{ steps.abi.outcome }}","abi_drift":"$(cat ../ci-out/abi_drift 2>/dev/null || echo unknown)","build":"${{ steps.build.outcome }}","exports":"${{ steps.exports.outcome }}"}
          EOF
          cat ../ci-out/status.json

      - name: Publish results to the ci-results branch
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/publish && cp -r ci-out /tmp/publish/
          cd /tmp/publish
          git init -q
          git checkout -q -b ci-results
          git config user.name "contri-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "ci results ${GITHUB_SHA}"
          # GitHub sometimes answers a push with a server error; try again.
          for i in 1 2 3; do git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results && break; [ "$i" = 3 ] && exit 1; sleep $((i * 5)); done

      - name: Fail the job if tests, ABI or build failed
        if: steps.test.outcome != 'success' || steps.abi.outcome != 'success' || steps.build.outcome != 'success' || steps.exports.outcome != 'success'
        run: |
          echo "A step failed. See the ci-results branch."
          exit 1

      - name: Fail the job if the committed ABI is out of date
        run: |
          if [ "$(cat ci-out/abi_drift 2>/dev/null)" != "false" ]; then
            echo "contract/abi/contri_abi.json differs from the interface. Copy contri_abi.json and contri_abi.zst from the ci-results branch."
            exit 1
          fi
        working-directory: .

name: domains

# Which domain names for Contri are free, and what Vercel charges for them.
# Results go to the domains-results branch.

on:
  push:
    branches: [main]
    paths:
      - scripts/domains.mjs
      - .github/workflows/domains.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/domains.mjs
      - run: |
          cd domains-out
          git init -q && git checkout -q -b domains-results
          git config user.name "contri-ci" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "domains ${GITHUB_SHA}"
          # GitHub sometimes answers a push with a server error; try again.
          for i in 1 2 3; do git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" domains-results && break; [ "$i" = 3 ] && exit 1; sleep $((i * 5)); done

name: web

# Deploys the site, app, relayer and keeper (app/) to Vercel with the Vercel
# CLI, using a VERCEL_TOKEN secret, so nobody has to click through Vercel's
# dashboard. Creates the Vercel project the first time, copies the server's
# settings from GitHub secrets into it, and deploys to production.
#
# Runs on every push that changes app/, and every 30 minutes to pick up newly
# added secrets (it only redeploys when the code or the secrets changed).
# The result, with the live URL, goes to the web-results branch.

on:
  push:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/web.yml
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: false

env:
  PROJECT: contri
  # The site's own domain. Its DNS records are printed to web-results/domain-setup.log.
  DOMAIN: contri.ng
  # VERCEL_TOKEN is given only to the steps that talk to Vercel, never to the
  # steps that install packages or run browsers. This is only whether it's set.
  HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}

jobs:
  deploy:
    # Pinned: Playwright's browser dependencies install reliably on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide whether to deploy
        id: decide
        env:
          CONTRI_ACCOUNT_ID: ${{ secrets.CONTRI_ACCOUNT_ID }}
          RELAYER_ACCOUNT_ID: ${{ secrets.RELAYER_ACCOUNT_ID }}
          RELAYER_KEY: ${{ secrets.RELAYER_KEY }}
          ONECLICK_API_KEY: ${{ secrets.ONECLICK_API_KEY }}
        run: |
          mkdir -p web-out
          if [ "$HAS_VERCEL_TOKEN" != "true" ]; then
            echo '{"deployed":false,"reason":"VERCEL_TOKEN is not set"}' > web-out/status.json
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A fingerprint of the code and the settings, so scheduled runs redeploy only
          # when something changed. Only a hash is kept, never a value.
          CODE=$(git log -1 --format=%H -- app)
          SETTINGS=$(printf '%s|%s|%s|%s' "$CONTRI_ACCOUNT_ID" "$RELAYER_ACCOUNT_ID" "$RELAYER_KEY" "$ONECLICK_API_KEY" | sha256sum | cut -c1-16)
          FINGERPRINT="$CODE-$SETTINGS"
          LAST=$(git fetch -q origin web-results 2>/dev/null && git show FETCH_HEAD:status.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).fingerprint||"")}catch{console.log("")}})' || true)
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LAST" = "$FINGERPRINT" ]; then
            echo "Nothing changed since the last deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Vercel CLI
        if: steps.decide.outputs.go == 'true'
        # Pinned: the CLI runs with the Vercel token.
        run: npm install -g vercel@65.11.0 --no-audit --no-fund 2>&1 | tail -1 && vercel --version

      - name: Create the Vercel project, link it, copy the server's settings
        if: steps.decide.outputs.go == 'true'
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CONTRI_ACCOUNT_ID: ${{ secrets.CONTRI_ACCOUNT_ID }}
          RELAYER_ACCOUNT_ID: ${{ secrets.RELAYER_ACCOUNT_ID }}
          RELAYER_KEY: ${{ secrets.RELAYER_KEY }}
          ONECLICK_API_KEY: ${{ secrets.ONECLICK_API_KEY }}
        run: node scripts/vercel.js setup 2>&1 | tee ../web-out/setup.log

      - name: Attach the custom domain
        if: steps.decide.outputs.go == 'true'
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node scripts/vercel.js attach 2>&1 | tee ../web-out/domain-setup.log || true
          { echo "NS:"; dig +short NS "$DOMAIN"; echo "A:"; dig +short A "$DOMAIN"; echo "www:"; dig +short CNAME "www.$DOMAIN"; echo "via 8.8.8.8:"; dig +short A "$DOMAIN" @8.8.8.8; } 2>&1 | tee ../web-out/dns.txt || true

      - name: Deploy to production
        if: steps.decide.outputs.go == 'true'
        id: deploy
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee ../web-out/deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' ../web-out/deploy.log | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          node scripts/vercel.js domain > ../web-out/domain.txt

      - name: Check the live site
        if: steps.decide.outputs.go == 'true'
        run: |
          ALIAS=$(cat web-out/domain.txt)
          [ -z "$ALIAS" ] && ALIAS="${{ steps.deploy.outputs.url }}"
          echo "Production: $ALIAS"
          for P in / /app /join /privacy /terms /how-it-works /api/config; do
            printf '%s %s\n' "$(curl -sS -o /dev/null -w '%{http_code}' "$ALIAS$P" 2>&1)" "$P"
          done | tee web-out/checks.txt
          # The custom domain's certificate, if any (Vercel issues it once DNS points here).
          echo | openssl s_client -connect "${ALIAS#https://}:443" -servername "${ALIAS#https://}" 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1 | tee web-out/tls.txt || true
          curl -s "$ALIAS/api/config" > web-out/config.json || true
          # The read proxy, end to end: the contract's config and NEAR Intents' salt.
          node scripts/live-check.mjs "$ALIAS" > web-out/live-check.txt 2>&1 || true
          curl -s -X POST "$ALIAS/api/rpc" -H 'Content-Type: application/json' \
            -d '{"calls":[{"contract":"contri","method":"get_config"},{"contract":"intents","method":"current_salt"}]}' > web-out/rpc.json || true
          echo "{\"deployed\":true,\"commit\":\"${GITHUB_SHA}\",\"fingerprint\":\"${{ steps.decide.outputs.fingerprint }}\",\"url\":\"$ALIAS\",\"deployment\":\"${{ steps.deploy.outputs.url }}\",\"at\":\"$(date -u +%FT%TZ)\"}" > web-out/status.json
          cat web-out/status.json

      # Every page, file, redirect and API route, then every screen in a real
      # browser. A broken link, missing file, blocked script or failing screen
      # fails the run (the results are still published below).
      - name: Check every page, file and API route
        if: steps.decide.outputs.go == 'true'
        run: |
          set -o pipefail
          node scripts/site-check.mjs "$(cat web-out/domain.txt)" 2>&1 | tee web-out/site-check.txt

      - name: Install browsers
        if: steps.decide.outputs.go == 'true'
        working-directory: app
        timeout-minutes: 8
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tail -1
          npx playwright install --with-deps chromium webkit firefox 2>&1 | tail -3

      - name: Check every screen in a browser
        if: steps.decide.outputs.go == 'true'
        working-directory: app
        timeout-minutes: 8
        run: |
          set -o pipefail
          node scripts/live-browser.mjs "$(cat ../web-out/domain.txt)" ../web-out/screens 2>&1 | tee ../web-out/live-browser.txt

      # Staying unlocked through a dropped tab and a browser restart, on Android
      # Chrome (and its desktop mode), iPhone Safari, and Chrome, Edge, Firefox
      # and Safari on computers, each in its real engine.
      - name: Check staying unlocked on every browser
        if: always() && steps.decide.outputs.go == 'true'
        working-directory: app
        timeout-minutes: 8
        run: |
          set -o pipefail
          node scripts/live-sessions.mjs "$(cat ../web-out/domain.txt)" 2>&1 | tee ../web-out/live-sessions.txt

      - name: Publish to the web-results branch
        if: always() && (steps.decide.outputs.go == 'true' || env.HAS_VERCEL_TOKEN != 'true')
        run: |
          cd web-out
          git init -q && git checkout -q -b web-results
          git config user.name "contri-ci" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "web ${GITHUB_SHA}"
          # GitHub sometimes answers a push with a server error; try again.
          for i in 1 2 3; do git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" web-results && break; [ "$i" = 3 ] && exit 1; sleep $((i * 5)); done

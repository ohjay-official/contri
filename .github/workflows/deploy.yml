name: deploy

# Mainnet. Three jobs:
# - status (every push and every 30 minutes): which secrets are set (yes/no
#   only, never values) and the public state of Contri's accounts.
# - deploy (a commit message with [deploy], or by itself the first time, once
#   the contract account is funded and CONTRI_DEPLOYER_KEY is set): builds the
#   contract and deploys it, initializing it the first time.
# - lock (a commit message with [lock]): deletes the contract account's key,
#   so nobody, us included, can change the code again.
# Reports go to the deploy-results branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CONTRI_ACCOUNT_ID: ${{ secrets.CONTRI_ACCOUNT_ID }}
  RELAYER_ACCOUNT_ID: ${{ secrets.RELAYER_ACCOUNT_ID }}

jobs:
  status:
    runs-on: ubuntu-latest
    outputs:
      first_deploy: ${{ steps.accounts.outputs.first_deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Which secrets are set (true or false only)
        run: |
          mkdir -p deploy-out
          cat > deploy-out/secrets.json <<JSON
          {
            "ONECLICK_API_KEY": ${{ secrets.ONECLICK_API_KEY != '' }},
            "CONTRI_ACCOUNT_ID": ${{ secrets.CONTRI_ACCOUNT_ID != '' }},
            "CONTRI_DEPLOYER_KEY": ${{ secrets.CONTRI_DEPLOYER_KEY != '' }},
            "RELAYER_ACCOUNT_ID": ${{ secrets.RELAYER_ACCOUNT_ID != '' }},
            "RELAYER_KEY": ${{ secrets.RELAYER_KEY != '' }},
            "VERCEL_TOKEN": ${{ secrets.VERCEL_TOKEN != '' }}
          }
          JSON
          cat deploy-out/secrets.json
      - name: Accounts on mainnet
        id: accounts
        run: |
          node app/scripts/status.js > deploy-out/accounts.json 2>&1 || true
          cat deploy-out/accounts.json
          # First deploy happens by itself once there's money and a key: either the
          # relayer is funded (it creates circles.<relayer>), or a separate contract
          # account exists with its own key.
          FIRST=$(node -e 'try { const a = JSON.parse(require("fs").readFileSync("deploy-out/accounts.json", "utf8")); const c = a.contri, r = a.relayer; console.log(Boolean((c && c.exists === false && r && r.exists && r.near >= 1.3 && r.keys > 0) || (c && c.exists && c.code === false && c.near >= 1.05 && c.keys > 0))); } catch { console.log(false); }')
          echo "first_deploy=$([ "$FIRST" = true ] && [ "${{ secrets.RELAYER_KEY != '' || secrets.CONTRI_DEPLOYER_KEY != '' }}" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish to the deploy-results branch
        run: |
          cd deploy-out
          git init -q && git checkout -q -b deploy-results
          git config user.name "contri-ci" && git config user.email "actions@users.noreply.github.com"
          git fetch -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy-results 2>/dev/null && git checkout -q FETCH_HEAD -- deploy.log 2>/dev/null || true
          git add -A && git commit -q -m "status ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy-results

  deploy:
    if: needs.status.outputs.first_deploy == 'true' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[deploy]') || contains(github.event.head_commit.message, '[lock]')))
    needs: status
    runs-on: ubuntu-latest
    env:
      DO_DEPLOY: ${{ needs.status.outputs.first_deploy == 'true' || contains(github.event.head_commit.message, '[deploy]') }}
      DO_LOCK: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lock]') }}
      # With [smoke], the deploy also checks the code on mainnet without USDT (see smoke() in deploy.js).
      SMOKE: ${{ contains(github.event.head_commit.message, '[smoke]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Install cargo-near
        if: env.DO_DEPLOY == 'true'
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build
        if: env.DO_DEPLOY == 'true'
        working-directory: contract
        run: |
          cargo test -q 2>&1 | tail -3
          cargo near build non-reproducible-wasm --no-abi 2>&1 | tail -5
          ls -l target/near/contri.wasm
      - name: Deploy
        if: env.DO_DEPLOY == 'true'
        env:
          CONTRI_DEPLOYER_KEY: ${{ secrets.CONTRI_DEPLOYER_KEY }}
          RELAYER_KEY: ${{ secrets.RELAYER_KEY }}
        run: |
          set -o pipefail
          node app/scripts/deploy.js contract/target/near/contri.wasm 2>&1 | tee deploy.log
      - name: Lock
        if: env.DO_LOCK == 'true'
        env:
          CONTRI_DEPLOYER_KEY: ${{ secrets.CONTRI_DEPLOYER_KEY }}
          RELAYER_KEY: ${{ secrets.RELAYER_KEY }}
        run: |
          set -o pipefail
          node app/scripts/deploy.js --lock 2>&1 | tee deploy.log
      - name: Publish the log
        if: always()
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          git init -q
          git fetch -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy-results && git checkout -q -b deploy-results FETCH_HEAD || git checkout -q -b deploy-results
          (echo "commit ${GITHUB_SHA} $(date -u +%FT%TZ)"; cat "$GITHUB_WORKSPACE/deploy.log" 2>/dev/null || echo "no log") > deploy.log
          git config user.name "contri-ci" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy-results

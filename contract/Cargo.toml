[package]
name = "contri"
version = "0.1.0"
edition = "2021"
description = "Contri: rotating savings circles (ajo) where the contract holds the pot"
license = "MIT"
repository = "https://github.com/ohjay-official/contri"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No default features: the default is the wee_alloc allocator, and the contract
# brings its own smaller one (src/bump.rs).
near-sdk = { version = "5", default-features = false }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
# Typed declaration of the same methods. Tests check every view's output against it.
contri-interface = { path = "interface" }
# Signs invite links in tests, as the app does.
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
strip = true
overflow-checks = true

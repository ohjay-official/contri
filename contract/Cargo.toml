[package]
name = "contri"
version = "0.1.0"
edition = "2021"
description = "Contri: rotating savings circles (ajo) where the contract holds the pot"
license = "MIT"
repository = "https://github.com/ohjay-official/contri"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
